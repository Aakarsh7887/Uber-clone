version: "3.9"

services:
  mongodb:
    image: mongo:6-alpine
    container_name: uber_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: uber-db
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - uber-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uber_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DB_URL=mongodb://mongodb:27017
      - PORT=5000
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - uber-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uber_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:5000
    networks:
      - uber-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local

networks:
  uber-network:
    driver: bridge
